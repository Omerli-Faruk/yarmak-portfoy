name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: 'backend/go.sum'

      # v2.12.2, go.mod'daki Go 1.25 ile derlenebilen son sürüm (v2.13+ Go 1.26 istiyor). Ayarlar: backend/.golangci.yml
      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      # -race cgo ister; ubuntu runner'da gcc hazır geliyor.
      - name: Run automated tests
        run: go test -v -race ./...

      - name: Build Go binary
        run: go build -v ./...

  frontend-build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # LayoutProps gibi global tipler .next/types altında üretiliyor; tsc'den önce gerekli.
      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
