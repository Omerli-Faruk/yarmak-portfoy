services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 VeritabanÄ± Servisi
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: midas_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stock_portfolio}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stock_portfolio}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - midas-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Otomatik Migration Servisi (Goose)
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: midas_migrate
    command: >
      goose -dir /app/sql/schema postgres "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-stock_portfolio}?sslmode=disable" up
    depends_on:
      db:
        condition: service_healthy
    networks:
      - midas-network
    restart: "no"

  # ---------------------------------------------------------------------------
  # 3. Golang Backend API Servisi
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: midas_api
    command: ["/app/server"]
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-stock_portfolio}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_at_least_32_characters_long}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - midas-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. BaÅŸlangÄ±Ã§ VarlÄ±klarÄ± YÃ¼kleyici (Seed Profile - Ä°steÄŸe BaÄŸlÄ±)
  # ---------------------------------------------------------------------------
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: midas_seed
    command: ["/app/seed"]
    environment:
      DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-stock_portfolio}?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - midas-network
    profiles:
      - seed

volumes:
  postgres_data:
    name: midas_postgres_data

networks:
  midas-network:
    name: midas_network
    driver: bridge
