services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: yarmak_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-yarmak}
    ports:
      # Yalnızca bu bilgisayardan erişilir; ağdaki diğer cihazlara açılmaz.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yarmak}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - yarmak-network
    restart: unless-stopped

  # Migration'lar (goose); uygulanınca kapanır
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yarmak_migrate
    command: >
      goose -dir /app/sql/schema postgres "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-yarmak}?sslmode=disable" up
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yarmak-network
    restart: "no"

  # Go API ve arka plan fiyat güncelleyicileri
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yarmak_api
    command: ["/app/server"]
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-yarmak}?sslmode=disable"
      # Boşsa API her açılışta geçici bir anahtar üretir. Sunucuda .env ile kalıcı bir anahtar verin.
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
      # HTTPS arkasında true yapın; yerelde (http://localhost) false kalmalı, yoksa giriş çerezi yazılmaz.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Swagger arayüzü (/swagger/index.html) yerelde açık; kapatmak için false.
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - yarmak-network
    restart: unless-stopped

  # Next.js arayüzü (http://localhost:3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Tarayıcının API adresi; derleme anında koda gömülür.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/v1}
    container_name: yarmak_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Next.js sunucu tarafı (API route'ları) backend'e Docker ağı üzerinden gider.
      BACKEND_INTERNAL_URL: http://api:8080/v1
    depends_on:
      - api
    networks:
      - yarmak-network
    restart: unless-stopped

  # İsteğe bağlı: BIST 100 ve popüler fon listesi. docker compose run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yarmak_seed
    command: ["/app/seed"]
    environment:
      DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-yarmak}?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - yarmak-network
    profiles:
      - seed

  # İsteğe bağlı: demo / demo12345 ile giriş yapılan örnek portföy. docker compose run --rm demo_seed
  demo_seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/seed", "-demo"]
    environment:
      DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-yarmak}?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - yarmak-network
    profiles:
      - demo

  # İsteğe bağlı: tüm TEFAS fonlarının 5 yıllık fiyat geçmişi. docker compose run --rm deep_seeder
  deep_seeder:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yarmak_deep_seeder
    command: ["/app/deep_seeder"]
    environment:
      DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-yarmak}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yarmak-network
    profiles:
      - deep_seed

volumes:
  postgres_data:
    name: yarmak_postgres_data

networks:
  yarmak-network:
    name: yarmak_network
    driver: bridge
