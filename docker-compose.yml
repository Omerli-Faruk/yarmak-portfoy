services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Veritabanı Servisi
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: yarmak_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-yarmak}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yarmak}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - yarmak-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Otomatik Migration Servisi (Goose)
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yarmak_migrate
    command: >
      goose -dir /app/sql/schema postgres "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-yarmak}?sslmode=disable" up
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yarmak-network
    restart: "no"

  # ---------------------------------------------------------------------------
  # 3. Golang Backend API Servisi
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yarmak_api
    command: ["/app/server"]
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-yarmak}?sslmode=disable"
      # Varsayılan anahtar YALNIZCA yerel geliştirme içindir; sunucuda mutlaka .env ile değiştirin.
      JWT_SECRET: ${JWT_SECRET:-yalnizca_yerel_gelistirme_icin_degistirin_0123456789}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
      # HTTPS arkasında true yapın; yerelde (http://localhost) false kalmalı, yoksa giriş çerezi yazılmaz.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Swagger arayüzü (/swagger/index.html) yerelde açık; kapatmak için false.
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - yarmak-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Next.js Arayüzü (http://localhost:3000)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Tarayıcının API adresi; derleme anında koda gömülür.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/v1}
    container_name: yarmak_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Next.js sunucu tarafı (API route'ları) backend'e Docker ağı üzerinden gider.
      BACKEND_INTERNAL_URL: http://api:8080/v1
    depends_on:
      - api
    networks:
      - yarmak-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 5. Başlangıç Varlıkları Yükleyici (Seed Profile - İsteğe Bağlı)
  # ---------------------------------------------------------------------------
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yarmak_seed
    command: ["/app/seed"]
    environment:
      DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-yarmak}?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - yarmak-network
    profiles:
      - seed

  # ---------------------------------------------------------------------------
  # 6. Demo Hesabı (İsteğe Bağlı): docker compose run --rm demo_seed
  #    demo / demo12345 ile giriş yapılan örnek portföy; yalnızca yerel deneme için.
  # ---------------------------------------------------------------------------
  demo_seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/seed", "-demo"]
    environment:
      DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-yarmak}?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - yarmak-network
    profiles:
      - demo

  # ---------------------------------------------------------------------------
  # 7. Derin Veri Tarayıcı (Deep Seeder - Arka planda 5 yıllık data çeker)
  # ---------------------------------------------------------------------------
  deep_seeder:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yarmak_deep_seeder
    command: ["/app/deep_seeder"]
    environment:
      DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-yarmak}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yarmak-network
    profiles:
      - deep_seed

volumes:
  postgres_data:
    name: yarmak_postgres_data

networks:
  yarmak-network:
    name: yarmak_network
    driver: bridge
