basePath: /v1
definitions:
  database.Asset:
    properties:
      assetType:
        type: string
      currentPrice:
        type: string
      id:
        format: int64
        type: integer
      name:
        type: string
      symbol:
        type: string
      updatedAt:
        type: string
    type: object
  database.Dividend:
    properties:
      amount:
        type: string
      assetID:
        format: int64
        type: integer
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/sql.NullTime'
      grossAmount:
        type: string
      id:
        format: int64
        type: integer
      netAmount:
        type: string
      paymentDate:
        type: string
      taxAmount:
        type: string
      userID:
        format: int64
        type: integer
    type: object
  database.PortfolioSnapshot:
    properties:
      id:
        format: int64
        type: integer
      profitLoss:
        type: string
      recordedAt:
        type: string
      totalCost:
        type: string
      totalValue:
        type: string
      userID:
        format: int64
        type: integer
    type: object
  database.PriceAlert:
    properties:
      assetID:
        format: int64
        type: integer
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/sql.NullTime'
      direction:
        type: string
      id:
        format: int64
        type: integer
      isTriggered:
        type: boolean
      targetPrice:
        type: string
      triggeredAt:
        $ref: '#/definitions/sql.NullTime'
      userID:
        format: int64
        type: integer
    type: object
  database.Split:
    properties:
      assetID:
        format: int64
        type: integer
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/sql.NullTime'
      id:
        format: int64
        type: integer
      splitDate:
        type: string
      splitRatio:
        type: string
    type: object
  database.Transaction:
    properties:
      amount:
        type: string
      assetID:
        format: int64
        type: integer
      commission:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/sql.NullTime'
      id:
        format: int64
        type: integer
      price:
        type: string
      realizedPnl:
        type: string
      transactionDate:
        type: string
      type:
        type: string
      userID:
        format: int64
        type: integer
    type: object
  database.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        format: int64
        type: integer
      passwordHash:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  handlers.AssetCategorySummary:
    properties:
      cost:
        type: number
      profit_loss:
        type: number
      value:
        type: number
    type: object
  handlers.authRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: Secret1234
        type: string
      username:
        example: John
        type: string
    type: object
  handlers.createAssetRequest:
    properties:
      asset_type:
        enum:
        - HISSE
        - FON
        - ALTIN
        - DOVIZ
        example: HISSE
        type: string
      name:
        example: Türk Hava Yolları
        type: string
      symbol:
        example: THYAO
        type: string
    type: object
  handlers.createDividendRequest:
    properties:
      amount:
        example: "500.00"
        type: string
      amount_per_share:
        example: "5.0"
        type: string
      asset_id:
        example: 1
        type: integer
      is_net:
        example: false
        type: boolean
      payment_date:
        example: "2026-08-21T12:00:00Z"
        type: string
      tax_rate:
        description: Stopaj oranı (0.15 ya da 15). Boşsa yeni kayıtta %15, güncellemede
          kaydın mevcut oranı kullanılır.
        example: "0.15"
        type: string
    type: object
  handlers.createPriceAlertRequest:
    properties:
      asset_id:
        example: 1
        type: integer
      direction:
        enum:
        - ABOVE
        - BELOW
        example: ABOVE
        type: string
      symbol:
        example: THYAO
        type: string
      target_price:
        example: "350.00"
        type: string
    type: object
  handlers.createSplitRequest:
    properties:
      asset_id:
        example: 1
        type: integer
      split_date:
        example: "2026-08-21T00:00:00Z"
        type: string
      split_ratio:
        example: "4.000000"
        type: string
    type: object
  handlers.createTransactionRequest:
    properties:
      amount:
        example: "10.0"
        type: string
      asset_id:
        example: 1
        type: integer
      asset_type:
        enum:
        - HISSE
        - FON
        - ALTIN
        - DOVIZ
        example: HISSE
        type: string
      commission:
        example: "15.50"
        type: string
      price:
        example: "305.50"
        type: string
      symbol:
        example: THYAO
        type: string
      transaction_date:
        example: "2026-08-21T12:00:00Z"
        type: string
      type:
        enum:
        - BUY
        - SELL
        example: BUY
        type: string
    type: object
  handlers.loginResponse:
    properties:
      user:
        $ref: '#/definitions/handlers.userResponse'
    type: object
  handlers.portfolioSummaryResponse:
    properties:
      breakdown:
        additionalProperties:
          $ref: '#/definitions/handlers.AssetCategorySummary'
        type: object
      capital_profit_loss:
        type: number
      capital_profit_loss_percentage:
        type: number
      holdings_count:
        type: integer
      period_returns:
        additionalProperties:
          format: float64
          type: number
        type: object
      period_values:
        additionalProperties:
          format: float64
          type: number
        type: object
      realized_profit_loss:
        type: number
      total_combined_profit:
        type: number
      total_combined_profit_usd:
        type: number
      total_commission:
        type: number
      total_cost:
        type: number
      total_dividends:
        type: number
      total_return_percentage:
        type: number
      total_value:
        type: number
      total_value_usd:
        type: number
      usd_rate:
        type: number
    type: object
  handlers.portfolioValueHistoryPoint:
    properties:
      cost:
        example: 118000
        type: number
      pnl:
        example: 7300.25
        type: number
      t:
        example: "2026-10-09T07:00:00Z"
        type: string
      value:
        example: 125000.5
        type: number
    type: object
  handlers.portfolioValueHistoryResponse:
    properties:
      baseline:
        allOf:
        - $ref: '#/definitions/handlers.portfolioValueHistoryPoint'
        description: 'Yalnızca 1D: önceki kapanıştaki portföy; pnl_change buna göre
          ölçülür, points''te yer almaz'
      end:
        example: "2026-10-10T09:30:00Z"
        type: string
      pnl_change:
        example: 2950.1
        type: number
      pnl_change_pct:
        example: 2.51
        type: number
      points:
        items:
          $ref: '#/definitions/handlers.portfolioValueHistoryPoint'
        type: array
      range:
        example: 1Y
        type: string
      start:
        example: "2025-10-10T07:00:00Z"
        type: string
    type: object
  handlers.updateTransactionRequest:
    properties:
      amount:
        example: 100
        type: number
      commission:
        example: 10
        type: number
      price:
        example: 25.5
        type: number
      transaction_date:
        type: string
      type:
        enum:
        - BUY
        - SELL
        example: BUY
        type: string
    type: object
  handlers.userHoldingResponse:
    properties:
      asset_id:
        type: integer
      asset_name:
        type: string
      asset_type:
        type: string
      average_cost:
        type: number
      current_price:
        type: number
      first_buy_date:
        type: string
      profit_loss:
        type: number
      symbol:
        type: string
      total_amount:
        type: number
      total_value:
        type: number
    type: object
  handlers.userResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
  sql.NullTime:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
info:
  contact: {}
  description: BIST 100 hisseleri, TEFAS yatırım fonları, altın ve döviz portföy takip
    sistemi REST API dokümantasyonu.
  title: Yarmak Borsa & Portföy Takip API
  version: "1.0"
paths:
  /alerts:
    get:
      description: Kullanıcının aktif ve tetiklenmiş tüm fiyat alarmlarını listeler
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.PriceAlert'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Kullanıcının Alarmlarını Listele
      tags:
      - Alerts
    post:
      consumes:
      - application/json
      description: Belirli bir hisse veya fon hedef fiyata ulaştığında tetiklenecek
        alarm kurar
      parameters:
      - description: Alarm Bilgileri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.createPriceAlertRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/database.PriceAlert'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Fiyat Alarmı Kur
      tags:
      - Alerts
  /alerts/{id}:
    delete:
      description: Kullanıcının kurduğu bir fiyat alarmını iptal eder/siler
      parameters:
      - description: Alarm ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Fiyat Alarmını Sil
      tags:
      - Alerts
  /assets:
    get:
      description: Sistemde kayıtlı tüm BIST hisseleri, TEFAS fonları ve altınları
        anlık fiyatlarıyla döner
      produces:
      - application/json
      responses: {}
      summary: Tüm Varlıkları Listele
      tags:
      - Assets
    post:
      consumes:
      - application/json
      description: Sisteme yeni bir hisse, fon, altın veya döviz varlığı ekler
      parameters:
      - description: Varlık Bilgileri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.createAssetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/database.Asset'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Yeni Varlık Tanımla (Admin)
      tags:
      - Assets
  /assets/{id}/price-history:
    get:
      description: Belirli bir varlığın tarihsel fiyat değişim geçmişini listeler
      produces:
      - application/json
      responses: {}
      summary: Varlık Fiyat Geçmişi
      tags:
      - Assets
  /assets/{id}/splits:
    get:
      description: Belirli bir hissenin geçmişte yaşadığı tüm bedelsiz bölünmeleri
        listeler
      parameters:
      - description: Varlık ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.Split'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Hissenin Bölünme Geçmişi
      tags:
      - Splits
  /assets/lookup:
    get:
      description: Sembol ve türe göre varlık arar; sistemde yoksa ve kullanıcı giriş
        yapmışsa piyasadan çekip ekler
      parameters:
      - description: Varlık sembolü
        example: THYAO
        in: query
        name: symbol
        required: true
        type: string
      - description: Varlık türü (varsayılan HISSE)
        enum:
        - HISSE
        - FON
        - ALTIN
        - DOVIZ
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.Asset'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sembolle varlık arama
      tags:
      - Assets
  /dividends:
    get:
      description: Kullanıcının aldığı tüm temettü ödemelerini listeler
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.Dividend'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Kullanıcının Temettü Geçmişi
      tags:
      - Dividends
    post:
      consumes:
      - application/json
      description: Kullanıcının aldığı nakit temettü ödemesini kaydeder
      parameters:
      - description: Temettü Bilgileri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.createDividendRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/database.Dividend'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Temettü Geliri Kaydet
      tags:
      - Dividends
  /dividends/{id}:
    delete:
      description: Kullanıcının kaydettiği bir temettü gelirini siler
      parameters:
      - description: Temettü ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Temettü Kaydını Sil
      tags:
      - Dividends
    put:
      consumes:
      - application/json
      description: Kullanıcının kaydettiği bir temettü gelirini günceller
      parameters:
      - description: Temettü ID
        in: path
        name: id
        required: true
        type: integer
      - description: Güncellenecek Temettü Bilgileri
        in: body
        name: dividend
        required: true
        schema:
          $ref: '#/definitions/handlers.createDividendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.Dividend'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Temettü Kaydını Güncelle
      tags:
      - Dividends
  /login:
    post:
      consumes:
      - application/json
      description: E-posta veya kullanıcı adı ve şifreyle giriş yapar, tokenları çerez
        olarak döner
      parameters:
      - description: Giriş Bilgileri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.authRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.loginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Kullanıcı Girişi
      tags:
      - Auth
  /me:
    get:
      description: JWT token ile doğrulanmış kullanıcının profil bilgilerini döner
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.userResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Giriş Yapmış Kullanıcı Bilgisi
      tags:
      - Auth
  /portfolio/history:
    get:
      description: Kullanıcının portföyünün zaman içindeki gelişimini grafik için
        döner
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.PortfolioSnapshot'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Portföy Tarihsel Grafik Geçmişi
      tags:
      - Portfolio
  /portfolio/holdings:
    get:
      description: Kullanıcının sahip olduğu tüm varlıkları, lot sayılarını ve kâr/zararlarını
        döner
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.userHoldingResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Kullanıcının Varlıklarını (Holdings) Listele
      tags:
      - Portfolio
  /portfolio/holdings/{symbol}:
    delete:
      description: Kullanıcının belirtilen sembole ait tüm işlemlerini soft-delete
        yaparak portföyünden kaldırır.
      parameters:
      - description: Varlık Sembolü (örn. THYAO, ASELS)
        in: path
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Varlığı Portföyden Tamamen Sil
      tags:
      - Portfolio
  /portfolio/summary:
    get:
      description: Toplam portföy değeri, toplam maliyet, kâr/zarar, dolar karşılığı
        ve kategori dağılımını döner
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.portfolioSummaryResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Portföy Özeti (TL ve Dolar)
      tags:
      - Portfolio
  /portfolio/value-history:
    get:
      description: Seçilen aralıkta portföy değeri, maliyeti ve toplam kâr/zararının
        (gerçekleşen kâr ve temettü dahil) zaman serisini döner. Aralık portföyden
        uzunsa seri ilk işlemden başlar.
      parameters:
      - description: Aralık (varsayılan 1Y)
        enum:
        - 1D
        - 1W
        - 1M
        - 3M
        - 6M
        - YTD
        - 1Y
        - 3Y
        - 5Y
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.portfolioValueHistoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Portföy Değer Geçmişi
      tags:
      - Portfolio
  /refresh:
    post:
      description: refresh_token çerezini kullanarak yeni tokenları çerez olarak döner
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Access Token Yenile (Refresh)
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Yeni bir kullanıcı hesabı oluşturur
      parameters:
      - description: Kayıt Bilgileri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.authRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/database.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Yeni Kullanıcı Kaydı
      tags:
      - Auth
  /revoke:
    post:
      description: Kullanıcının refresh token'ını iptal ederek oturumunu kapatır (Logout)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Oturumu Kapat / Token İptal Et (Revoke)
      tags:
      - Auth
  /splits:
    post:
      consumes:
      - application/json
      description: Hissede bölünme uygular ve tüm kullanıcıların geçmiş işlemlerini
        günceller
      parameters:
      - description: Bölünme Parametreleri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.createSplitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/database.Split'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Bedelsiz/Ters Bölünme Uygula (Admin)
      tags:
      - Splits
  /transactions:
    get:
      description: Kullanıcının geçmiş alım/satım işlemlerini sayfalanmış olarak listeler
      parameters:
      - default: 1
        description: Sayfa Numarası
        in: query
        name: page
        type: integer
      - default: 10
        description: Sayfa Başına Kayıt Sayısı
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.Transaction'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: İşlem Geçmişi (Pagination)
      tags:
      - Transactions
    post:
      consumes:
      - application/json
      description: Kullanıcı portföyüne yeni bir alım (BUY) veya satım (SELL) işlemi
        kaydeder
      parameters:
      - description: İşlem Bilgileri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.createTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/database.Transaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Alım/Satım İşlemi Yap
      tags:
      - Transactions
  /transactions/{id}:
    delete:
      description: Kullanıcının gerçekleştirdiği bir alım veya satım işlemini siler
      parameters:
      - description: İşlem ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Alım/Satım İşlemini Sil
      tags:
      - Transactions
    put:
      consumes:
      - application/json
      description: Kullanıcının gerçekleştirdiği bir alım veya satım işleminin adet,
        fiyat, komisyon veya tarihini günceller
      parameters:
      - description: İşlem ID
        in: path
        name: id
        required: true
        type: integer
      - description: Güncellenecek işlem bilgileri
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.updateTransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.Transaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Alım/Satım İşlemini Güncelle
      tags:
      - Transactions
securityDefinitions:
  BearerAuth:
    description: JWT Token'ınızı 'Bearer <token>' formatında giriniz.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
