version: "2"

linters:
  settings:
    errcheck:
      # Okuma bittikten sonra kapatma hatası işe yarar bir bilgi taşımıyor; her defer'e `_ =` eklemek yerine burada muaf tutuyoruz.
      exclude-functions:
        - (io.ReadCloser).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
    staticcheck:
      checks:
        - all
        # golangci-lint varsayılanında da kapalı olanlar (paket yorumu, isimlendirme)
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Hata mesajları Türkçe ve doğrudan kullanıcıya gösteriliyor; büyük harfle başlamaları bilinçli.
        - -ST1005
        # "if yerine switch kullanılabilir" yalnızca öneri; iki dallı if'ler okunur durumda.
        - -QF1003
